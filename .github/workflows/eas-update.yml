name: EAS Update — OTA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install
        working-directory: mobile

      - name: Publish OTA update
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://kxtsoyessegtarusiiov.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dHNveWVzc2VndGFydXNpaW92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzExMjcsImV4cCI6MjA5OTUwNzEyN30.4oaLj6eP1PijapLRGKFQV8fPcp_9HtV06XXgt5uzg_4
