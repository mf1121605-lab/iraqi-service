name: EAS Update — فوري للتطبيق

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  update:
    name: Push OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm install
        working-directory: mobile

      - name: Push update to app
        run: eas update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: https://kxtsoyessegtarusiiov.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dHNveWVzc2VndGFydXNpaW92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzExMjcsImV4cCI6MjA5OTUwNzEyN30.4oaLj6eP1PijapLRGKFQV8fPcp_9HtV06XXgt5uzg_4
