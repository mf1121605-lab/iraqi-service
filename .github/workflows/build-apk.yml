name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ./mobile-app

    env:
      CI: true
      EXPO_NO_DOTENV: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Create Expo environment file
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_APP_URL=https://iraqi-service.vercel.app
          EOF

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --clean --non-interactive
          fi

      - name: Configure Gradle for low-memory GitHub runners
        run: |
          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
          org.gradle.parallel=false
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC' \
            -Dorg.gradle.parallel=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            -x lint \
            -x test
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-service-app
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
